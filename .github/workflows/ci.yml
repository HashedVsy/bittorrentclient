name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows / MSVC / CMake
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/bittorrentclient.exe dist/
      - uses: actions/upload-artifact@v6
        with:
          name: bittorrentclient-windows-x64
          path: dist/

  linux-gcc:
    name: Linux / GCC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy cmake libcurl4-openssl-dev libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build with warnings
        run: cmake --build build --parallel -- -k
      - name: Run clang-tidy where available
        shell: bash
        run: |
          set +e
          find src -name '*.c' -print0 | xargs -0 -r -n1 clang-tidy -p build
          test ${PIPESTATUS[1]} -eq 0

  sanitizers:
    name: Address/Undefined sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libcurl4-openssl-dev libssl-dev
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel

  security:
    name: Dependency/security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check repository
        run: git fsck --full
      - name: Check for accidental secrets
        shell: bash
        run: |
          ! grep -RInE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' --exclude-dir=.git .
