name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        uses: lukka/get-cmake@latest
      - name: Restore vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
